name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (e.g. 101)'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Official Stable Release'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web UI
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Stable Release APK
        run: ./gradlew assembleStableRelease

      - name: Determine Version Metadata
        id: version_info
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ github.event.inputs.version_name }}" ]]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            VERSION_CODE="${{ github.event.inputs.version_code }}"
            RELEASE_NOTES="${{ github.event.inputs.release_notes }}"
          else
            VERSION_NAME="${TAG_NAME#v}"
            VERSION_CODE=$(git rev-list --count HEAD)
            RELEASE_NOTES="Official Release ${TAG_NAME}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES=${RELEASE_NOTES}" >> $GITHUB_OUTPUT

      - name: Update version.json
        run: |
          cat <<EOF > version.json
          {
            "version": "${{ steps.version_info.outputs.VERSION_NAME }}",
            "versionName": "${{ steps.version_info.outputs.VERSION_NAME }}",
            "versionCode": ${{ steps.version_info.outputs.VERSION_CODE }},
            "build": ${{ steps.version_info.outputs.VERSION_CODE }},
            "name": "BubbaFlix TV",
            "channel": "release",
            "apkUrl": "https://github.com/jsanderstechnologies/BubbaFlix_AndroidTV/releases/latest/download/BubbaFlixTV.apk",
            "releaseNotes": "${{ steps.version_info.outputs.RELEASE_NOTES }}"
          }
          EOF

      - name: Commit and Push version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(release): bump version.json to ${{ steps.version_info.outputs.VERSION_NAME }}" || echo "No changes to commit"
          git push origin main || echo "Unable to push commit"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BubbaFlix TV v${{ steps.version_info.outputs.VERSION_NAME }}
          body: ${{ steps.version_info.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/stable/release/BubbaFlixTV.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
