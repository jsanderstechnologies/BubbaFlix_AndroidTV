plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jsanderstechnologies.bubbaflix'
    compileSdk 34

    defaultConfig {
        applicationId "com.jsanderstechnologies.bubbaflix"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "channel"
    productFlavors {
        stable {
            dimension "channel"
            applicationIdSuffix ""
            manifestPlaceholders = [appName: "BubbaFlix TV"]
            buildConfigField "String", "UPDATE_JSON_URL", "\"https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix_AndroidTV/main/version.json\""
            buildConfigField "String", "BUILD_CHANNEL", "\"release\""
        }
        nightly {
            dimension "channel"
            applicationIdSuffix ".nightly"
            versionNameSuffix "-nightly"
            manifestPlaceholders = [appName: "BubbaFlix TV (Nightly)"]
            buildConfigField "String", "UPDATE_JSON_URL", "\"https://raw.githubusercontent.com/jsanderstechnologies/BubbaFlix_AndroidTV/main/version-nightly.json\""
            buildConfigField "String", "BUILD_CHANNEL", "\"nightly\""
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.flavorName == 'nightly') {
                output.outputFileName = "BubbaFlixTV-Nightly.apk"
            } else {
                output.outputFileName = "BubbaFlixTV.apk"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.leanback:leanback:1.0.0'

    // AndroidX Media3 (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.2.1'
    implementation 'androidx.media3:media3-extractor:1.2.1'

    // OkHttp for network requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
